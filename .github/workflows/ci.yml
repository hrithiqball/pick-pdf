name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp exec playwright install --with-deps chromium
      - run: vp check
      # e2e tests build the app and run it in workerd via `vp preview`
      - run: vp test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
